name: "CLA Assistant"

# Requires contributors to sign the SomnoTrace CLA before their pull request
# can be merged. Uses the open-source CLA Assistant Lite action, which records
# signatures in this repository (no external service required).
#
# Setup notes:
#   1. Make the "CLA Assistant" check a REQUIRED status check in
#      Settings > Branches > branch protection rules for your default branch.
#   2. The default GITHUB_TOKEN is sufficient; no extra secret is needed for a
#      single-repo setup. (Optional: set a PERSONAL_ACCESS_TOKEN secret if you
#      store signatures in a separate repository.)
#   3. Signatures are stored at signatures/version1/cla.json on the
#      "cla-signatures" branch of this repo.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/ilyakruchinin/SomnoTrace/blob/main/CLA/individual-cla.md"
          branch: "cla-signatures"
          allowlist: ilyakruchinin,dependabot[bot],*[bot]

          # Text shown to contributors on the PR.
          custom-notsigned-prcomment: >
            Thank you for your contribution to **SomnoTrace**! Before we can
            merge it, please read our
            [Contributor License Agreement](https://github.com/ilyakruchinin/SomnoTrace/blob/main/CLA/individual-cla.md)
            (corporate contributors: see
            [Corporate CLA](https://github.com/ilyakruchinin/SomnoTrace/blob/main/CLA/corporate-cla.md))
            and sign it by posting the comment below.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
          lock-pullrequest-aftermerge: false
