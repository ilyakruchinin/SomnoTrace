<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D36"/>
      <stop offset="100%" stop-color="#122B4A"/>
    </linearGradient>
    
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="40%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    
    <filter id="pulseGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5" result="blur">
        <animate attributeName="stdDeviation" values="3.8;7.2;3.8" dur="4.8s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="205"/>
    </clipPath>
    
    <!-- Mask that creates a true crescent (cut-out is fully transparent) -->
    <mask id="crescentMask">
      <!-- Full moon area (white = visible) — larger, higher, more centered -->
      <circle cx="308" cy="112" r="38" fill="white"/>
      <!-- Cut-out circle (black = transparent) — keeps crescent shape -->
      <circle cx="328" cy="100" r="31" fill="black"/>
    </mask>
  </defs>
  
  <!-- Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#1E3A5F" stroke-width="8" opacity="0.55"/>
  
  <!-- Accent ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#22D3EE" stroke-width="2.2" opacity="0.28" filter="url(#ringGlow)">
    <animate attributeName="opacity" values="0.15;0.38;0.15" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Scrolling waveform -->
  <g clip-path="url(#circleClip)">
    <g>
      <animateTransform attributeName="transform"
                        type="translate"
                        from="0 0"
                        to="-400 0"
                        dur="4s"
                        repeatCount="indefinite"
                        calcMode="linear"/>
      
      <path fill="none"
            stroke="url(#waveGrad)"
            stroke-width="12"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#pulseGlow)"
            d="M -800 278
C -750 278 -750 198 -700 198
C -650 198 -650 278 -600 278
C -550 278 -550 358 -500 358
C -450 358 -450 278 -400 278
C -350 278 -350 198 -300 198
C -250 198 -250 278 -200 278
C -150 278 -150 358 -100 358
C -50 358 -50 278 0 278
C 50 278 50 198 100 198
C 150 198 150 278 200 278
C 250 278 250 358 300 358
C 350 358 350 278 400 278
C 450 278 450 198 500 198
C 550 198 550 278 600 278
C 650 278 650 358 700 358
C 750 358 750 278 800 278
C 850 278 850 198 900 198
C 950 198 950 278 1000 278
C 1050 278 1050 358 1100 358
C 1150 358 1150 278 1200 278
C 1250 278 1250 198 1300 198
C 1350 198 1350 278 1400 278
C 1450 278 1450 358 1500 358
C 1550 358 1550 278 1600 278"/>
      
      <path fill="none"
            stroke="#67E8F9"
            stroke-width="3.6"
            stroke-linecap="round"
            opacity="0.22"
            d="M -800 289
C -750 289 -750 228 -700 228
C -650 228 -650 289 -600 289
C -550 289 -550 345 -500 345
C -450 345 -450 289 -400 289
C -350 289 -350 228 -300 228
C -250 228 -250 289 -200 289
C -150 289 -150 345 -100 345
C -50 345 -50 289 0 289
C 50 289 50 228 100 228
C 150 228 150 289 200 289
C 250 289 250 345 300 345
C 350 345 350 289 400 289
C 450 289 450 228 500 228
C 550 228 550 289 600 289
C 650 289 650 345 700 345
C 750 345 750 289 800 289
C 850 289 850 228 900 228
C 950 228 950 289 1000 289
C 1050 289 1050 345 1100 345
C 1150 345 1150 289 1200 289
C 1250 289 1250 228 1300 228
C 1350 228 1350 289 1400 289
C 1450 289 1450 345 1500 345
C 1550 345 1550 289 1600 289">
        <animate attributeName="opacity" values="0.1;0.26;0.1" dur="4.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- True crescent moon (mask makes the cut-out fully transparent) -->
  <circle cx="308" cy="112" r="38" fill="#E0F2FE" mask="url(#crescentMask)">
    <animate attributeName="opacity" values="0.68;1;0.68" dur="6s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Stars -->
  <circle cx="142" cy="152" r="6.5" fill="#A5B4FC">
    <animate attributeName="opacity" values="0.28;1;0.28" dur="2.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="168" cy="118" r="5" fill="#67E8F9">
    <animate attributeName="opacity" values="0.22;0.9;0.22" dur="3.3s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="390" cy="185" r="5.2" fill="#22D3EE">
    <animate attributeName="opacity" values="0.22;0.95;0.22" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
